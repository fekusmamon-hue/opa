name: Build mod
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Descargar Cobblemon
        run: |
          mkdir -p libs
          URL=$(curl -s -H "User-Agent: maxivlock-build" 'https://api.modrinth.com/v2/project/cobblemon/version?loaders=%5B%22fabric%22%5D&game_versions=%5B%221.21.1%22%5D' | jq -r '.[0].files[] | select(.primary==true) | .url')
          echo "Descargando: $URL"
          curl -L -H "User-Agent: maxivlock-build" -o libs/cobblemon-fabric.jar "$URL"
          ls -la libs
      - name: Compilar
        run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: maxivlock-mod
          path: build/libs/*.jar
